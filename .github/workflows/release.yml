name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          # GitHub-hosted runner 已预装 Android SDK；setup-android v3 内部的
          # `sdkmanager tools` 在新版 cmdline-tools 已不存在，会直接失败。
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -n "$SDK" || { echo "Android SDK not found"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || SDKMANAGER=$(command -v sdkmanager)
          test -n "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Resolve version and notes
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          NOTES="release-notes/v${VERSION}.md"
          test -n "$VERSION" || { echo "versionName not found"; exit 1; }
          test -n "$CODE" || { echo "versionCode not found"; exit 1; }
          test -f "$NOTES" || { echo "missing release notes: $NOTES"; exit 1; }
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            test "${GITHUB_REF_NAME}" = "v${VERSION}" || {
              echo "tag ${GITHUB_REF_NAME} does not match versionName ${VERSION}"
              exit 1
            }
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.PIKA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || {
            echo "PIKA_KEYSTORE_BASE64 secret is missing; cannot sign with the installed release key"
            exit 1
          }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pika.keystore"
          test -s "$RUNNER_TEMP/pika.keystore"

      - name: Build release
        env:
          PIKA_KEYSTORE: ${{ runner.temp }}/pika.keystore
          PIKA_KS_PW: ${{ secrets.PIKA_KS_PW }}
          PIKA_KEY_ALIAS: ${{ secrets.PIKA_KEY_ALIAS }}
          PIKA_KEY_PW: ${{ secrets.PIKA_KEY_PW }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signing key continuity
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0"
          CERTS=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")
          echo "$CERTS"
          echo "$CERTS" | grep -qi "e72843708a92958b7ae82c230ddef2c3bf53aa7b" || {
            echo "APK signature does not match the installed release key (e7284370...aa7b)"
            exit 1
          }

      - name: Prepare release asset
        id: artifact
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/pika-v${VERSION}.apk"
          SHA=$(sha256sum "dist/pika-v${VERSION}.apk" | cut -d' ' -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "path=dist/pika-v${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" "${{ steps.artifact.outputs.path }}" \
            --title "PiKA v${VERSION}" \
            --notes-file "${{ steps.version.outputs.notes }}" \
            --target main

      - name: Update update.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          SHA256: ${{ steps.artifact.outputs.sha }}
          NOTES_FILE: ${{ steps.version.outputs.notes }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --ff-only origin main
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("update.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          version = os.environ["VERSION"]
          notes = pathlib.Path(os.environ["NOTES_FILE"]).read_text(encoding="utf-8").strip()
          repo = os.environ["REPO"]
          data["sha256"] = os.environ["SHA256"]
          data["version"] = version
          data["apkUrl"] = f"https://github.com/{repo}/releases/download/v{version}/pika-v{version}.apk"
          data["notes"] = notes
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          if git diff --quiet -- update.json; then
            echo "update.json already current"
            exit 0
          fi
          git add update.json
          git commit -m "release: v${VERSION} (build ${VERSION_CODE})"
          git push origin main
